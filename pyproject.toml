[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-monitor"
version = "1.0.0"
description = "Deterministic market-state analytics across major equity markets using transparent trend, momentum, realised-volatility and benchmark-relative measures."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "fastapi==0.157.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "azure-communication-email==1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
