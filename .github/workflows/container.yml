name: Container

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aminquantsystems/market-regime-monitor:${{ github.sha }}
            ghcr.io/aminquantsystems/market-regime-monitor:main
      - name: Make the package public and keep it linked to this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH -H "Accept: application/vnd.github+json" \
              "/users/AminQuantSystems/packages/container/market-regime-monitor" \
              -f visibility=public; then
              exit 0
            fi
            sleep 5
          done
          echo "The image was published. Package visibility still needs an owner check."
          exit 1
